<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f8fe" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1520" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Explore Nova.Avalonia.AIKit controls and samples in your browser.">
    <title>Nova.Avalonia.AIKit Gallery</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <main id="out">
        <div class="avalonia-splash" role="status" aria-live="polite" aria-label="Loading Nova.Avalonia.AIKit Gallery">
            <div class="splash-glow splash-glow-top" aria-hidden="true"></div>
            <div class="splash-glow splash-glow-bottom" aria-hidden="true"></div>

            <div class="splash-content">
                <div class="splash-mark" aria-hidden="true">
                    <img src="./favicon.ico" alt="">
                </div>

                <div class="splash-copy">
                    <div class="splash-title"><strong>Nova</strong><span>.Avalonia.AIKit</span></div>
                    <p>AI-native controls for Avalonia</p>
                </div>

                <div class="splash-loading" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="splash-label">Loading gallery</span>
            </div>

            <span class="splash-footer">WebAssembly Gallery</span>
        </div>
    </main>
    <noscript>This gallery needs JavaScript and WebAssembly enabled.</noscript>
    <script type="module" src="./main.js"></script>
</body>
</html>
